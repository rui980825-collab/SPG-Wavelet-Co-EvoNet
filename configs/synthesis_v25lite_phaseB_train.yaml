seed: 42
seed_mode: sweep
seed_base: 42
seed_shard: 0
device: cuda
amp: true

use_semantic_gate: true
use_photometric: true
use_context_place: true
use_prototype_sampling: true
use_wavelet_refiner: false
use_legal_region_sampling: true

switches:
  use_semantic_gate: true
  use_photometric: true
  use_context_place: true
  use_prototype_sampling: true
  use_wavelet_refiner: false
  use_legal_region_sampling: true

proto_k: 1
proto_bank_path: runs/prototypes/v25lite/20260305_155308/prototypes.npy
proto_temperature: 0.07
beta_confuse: 1.0
alpha_imbalance: 1.0
proto_candidate_pool: 256

legal_region_probe_trials: 480
legal_region_pool_size: 160

tau_ctx: 0.55
hard_prior_tau: 0.30
score_place_min: 0.58
max_trials: 62
day_v_threshold: 112.0
night_v_threshold: 80.0
max_l_gap_pre: 140.0
max_ab_gap_pre: 45.0
max_l_gap_day: 36.0
max_ab_gap_day: 30.0
max_l_gap_night: 48.0
max_ab_gap_night: 40.0
max_l_gap_twilight: 42.0
max_ab_gap_twilight: 35.0

thresholds:
  tau_ctx: 0.55
  hard_prior_tau: 0.30
  score_place_min: 0.58
  max_trials: 62
  day_v_threshold: 112.0
  night_v_threshold: 80.0
  max_l_gap_pre: 140.0
  max_ab_gap_pre: 45.0
  max_l_gap_day: 36.0
  max_ab_gap_day: 30.0
  max_l_gap_night: 48.0
  max_ab_gap_night: 40.0
  max_l_gap_twilight: 42.0
  max_ab_gap_twilight: 35.0

patch_bank_root: data/patches/patch_bank
background_pool_root: data/patches/background_pool
context_rules_path: configs/context_rules.yaml

generator_ckpt: runs/gen/uav_rgbir/20251226_160415/checkpoints/best.pth

out_root: runs/synth/uav_rgbir/v25lite_phaseB_train
append_run_id: true

n_images: 2000
image_ext: jpg
jpeg_quality: 95

mode: translate
canvas_w: 640
canvas_h: 512
objects_per_image: [1, 8]

max_iou: 0.10
max_place_trials: 62
scale_range: [0.7, 1.4]
feather: 4

gen_patch_size: 64
gen_context: 8
save_preview_every: 200

constraints:
  tau_ctx: 0.55
  hard_prior_tau: 0.30
  score_place_min: 0.58
  enable_semantic_gate: true
  allow_unknown_scene: true

  class_to_context:
    ship: ["sea", "lake"]
    car: ["city road", "country road", "bridge"]
    bus: ["city road", "country road", "bridge"]
    pedestrian: ["city road", "country road", "bridge", "playground", "airport"]
    cyclist: ["city road", "country road", "bridge", "playground"]
    plane: ["airport", "sky"]
    drone: ["sky", "airport", "city road", "country road", "bridge", "sea", "lake", "playground"]

  enable_photometric: true
  lab_match_strength: 1.0
  max_l_gap: 40.0
  max_ab_gap: 35.0
  max_l_gap_pre: 140.0
  max_ab_gap_pre: 45.0
  day_v_threshold: 112.0
  night_v_threshold: 80.0
  max_l_gap_day: 36.0
  max_ab_gap_day: 30.0
  max_l_gap_night: 48.0
  max_ab_gap_night: 40.0
  max_l_gap_twilight: 42.0
  max_ab_gap_twilight: 35.0

  enable_context_aware: true
  max_edge_density: 0.22
  max_texture: 35.0

  feather: 4
